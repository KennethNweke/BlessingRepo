<style>
  /* ─────────────────────────────────────────────
     RSVP DESTINATION — paste your Apps Script URL
     between the quotes. Setup steps are in README.md
     ───────────────────────────────────────────── */
  /* (the script constant lives at the bottom of this file) */

  :root{
    --ink:#1E1714;
    --ink-soft:#2C2320;
    --stone:#EFE4D4;
    --stone-dim:#C9B69E;
    --plum:#5C2340;
    --fuchsia:#C4126C;
    --amber:#E3A552;
    --measure:34rem;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--ink);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--stone);
    font-family:"Karla","Helvetica Neue",Arial,sans-serif;
    font-weight:300;
    font-size:clamp(1rem,.95rem + .25vw,1.125rem);
    line-height:1.65;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  ::selection{background:var(--fuchsia);color:#fff}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

  /* ── hero ───────────────────────────────── */
  .hero{
    position:relative;
    min-height:100svh;
    display:grid;
    grid-template-rows:1fr auto;
    isolation:isolate;
  }
  .hero__photo{
    position:absolute;inset:0;z-index:-2;
    width:100%;height:100%;object-fit:cover;object-position:50% 38%;
  }
  .hero::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(to bottom,rgba(30,23,20,.42) 0%,rgba(30,23,20,0) 28%,rgba(30,23,20,.15) 55%,rgba(30,23,20,.88) 90%,var(--ink) 100%);
  }
  .hero__inner{
    align-self:end;
    padding:0 1.5rem 3.5rem;
    text-align:center;
  }
  .names{
    margin:0;
    font-family:"Fraunces",Georgia,serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-size:clamp(4.5rem,22vw,11rem);
    line-height:.86;
    letter-spacing:-.02em;
    color:#fff;
    text-shadow:0 2px 40px rgba(20,12,8,.55);
  }
  .names .amp{
    font-style:italic;
    font-weight:300;
    font-size:.52em;
    color:var(--amber);
    display:inline-block;
    transform:translateY(-.14em);
    margin:0 .06em;
  }
  .when{
    margin:1.4rem 0 0;
    font-size:.82rem;
    letter-spacing:.32em;
    text-indent:.32em;
    font-weight:400;
    color:var(--stone);
    opacity:.92;
  }
  .hero__cue{
    display:inline-block;
    margin-top:2.6rem;
    font-size:.78rem;
    letter-spacing:.14em;
    color:var(--stone);
    text-decoration:none;
    border-bottom:1px solid rgba(239,228,212,.35);
    padding-bottom:.35rem;
    transition:border-color .3s,color .3s;
  }
  .hero__cue:hover{border-color:var(--amber);color:var(--amber)}

  /* ── generic section ────────────────────── */
  .wrap{width:min(100% - 2.5rem,68rem);margin-inline:auto}
  .note{
    max-width:var(--measure);
    margin-inline:auto;
    text-align:center;
    padding:5.5rem 0 3.5rem;
  }
  .note p{margin:0 0 1.1rem}
  .note p:last-child{margin-bottom:0}
  .lead{
    font-family:"Fraunces",Georgia,serif;
    font-weight:300;
    font-size:clamp(1.45rem,1.1rem + 1.6vw,2.15rem);
    line-height:1.32;
    color:#fff;
  }
  .lead em{font-style:italic;color:var(--amber)}
  .dim{color:var(--stone-dim);font-size:1rem}

  /* ── the day ────────────────────────────── */
  .day{
    text-align:center;
    padding:1rem 0 5.5rem;
    border-top:1px solid rgba(239,228,212,.14);
    margin-top:1rem;
  }
  .day h2{
    font-family:"Fraunces",Georgia,serif;
    font-weight:300;
    font-style:italic;
    font-size:clamp(1.8rem,1.3rem + 2vw,2.8rem);
    margin:3rem 0 .6rem;
    color:#fff;
  }
  .day .date{
    font-size:1.05rem;
    letter-spacing:.06em;
    margin:0 0 .5rem;
  }
  .day .place{color:var(--stone-dim);margin:0;max-width:30rem;margin-inline:auto}

  /* ── rsvp ───────────────────────────────── */
  .rsvp{
    background:var(--stone);
    color:var(--ink);
    padding:clamp(3.5rem,8vw,6rem) 0 clamp(3.5rem,8vw,5.5rem);
  }
  .rsvp__head{text-align:center;max-width:28rem;margin:0 auto clamp(2.5rem,5vw,3.5rem)}
  .rsvp h2{
    font-family:"Fraunces",Georgia,serif;
    font-weight:300;
    font-size:clamp(2.4rem,1.6rem + 3.5vw,4rem);
    line-height:1;
    margin:0 0 .75rem;
    color:var(--plum);
  }
  .rsvp__head p{margin:0;color:#6B564A}
  form{width:min(100%,32rem);margin-inline:auto}
  .field{margin-bottom:2.4rem}
  .field > label,
  .field > legend{
    display:block;
    font-size:.95rem;
    font-weight:500;
    color:var(--plum);
    margin-bottom:.7rem;
    padding:0;
  }
  .field input[type=text]{
    width:100%;
    font:inherit;
    font-weight:400;
    color:var(--ink);
    background:transparent;
    border:0;
    border-bottom:1px solid rgba(92,35,64,.35);
    padding:.55rem 0;
    border-radius:0;
    transition:border-color .25s;
  }
  .field input[type=text]::placeholder{color:#A8937F}
  .field input[type=text]:focus{outline:none;border-bottom-color:var(--fuchsia);border-bottom-width:2px;padding-bottom:calc(.55rem - 1px)}
  .field input[type=text]:focus-visible{outline:none}
  fieldset{border:0;margin:0;padding:0}
  .choices{display:grid;gap:.6rem}
  @media (min-width:480px){.choices{grid-template-columns:1fr 1fr}}
  .choice input{position:absolute;opacity:0;width:0;height:0}
  .choice span{
    display:block;
    text-align:center;
    padding:.9rem 1rem;
    font-size:.98rem;
    color:var(--plum);
    background:rgba(255,255,255,.5);
    border:1px solid rgba(92,35,64,.28);
    cursor:pointer;
    transition:background .2s,color .2s,border-color .2s;
  }
  .choice span:hover{border-color:var(--fuchsia)}
  .choice input:checked + span{
    background:var(--fuchsia);
    border-color:var(--fuchsia);
    color:#fff;
  }
  .choice input:focus-visible + span{outline:2px solid var(--plum);outline-offset:2px}
  .hint{font-size:.85rem;color:#8A7362;margin:.6rem 0 0}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button{
    width:100%;
    font:inherit;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--stone);
    background:var(--plum);
    border:0;
    padding:1.05rem 1.5rem;
    cursor:pointer;
    transition:background .25s,transform .1s;
  }
  button:hover{background:var(--fuchsia)}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.6;cursor:progress}
  .status{
    margin:1rem 0 0;
    min-height:1.4rem;
    font-size:.92rem;
    text-align:center;
    color:#8A7362;
  }
  .status.error{color:#A8123C}
  .thanks{
    text-align:center;
    width:min(100%,32rem);
    margin-inline:auto;
    padding:1rem 0;
  }
  .thanks h3{
    font-family:"Fraunces",Georgia,serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1.9rem,1.4rem + 2vw,2.6rem);
    color:var(--plum);
    margin:0 0 .6rem;
  }
  .thanks p{margin:0;color:#6B564A}
  [hidden]{display:none !important}

  /* ── footer ─────────────────────────────── */
  footer{
    text-align:center;
    padding:3.5rem 1.5rem calc(3.5rem + env(safe-area-inset-bottom,0px));
    color:var(--stone-dim);
    font-size:.82rem;
    letter-spacing:.2em;
    text-indent:.2em;
  }

  /* ── one orchestrated entrance ──────────── */
  @media (prefers-reduced-motion:no-preference){
    .names,.when,.hero__cue{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
    .when{animation-delay:.35s}
    .hero__cue{animation-delay:.6s}
    @keyframes rise{from{opacity:0;transform:translateY(1.6rem)}to{opacity:1;transform:none}}
  }
</style>
</head>

    <h1 class="names">B<span class="amp">&amp;</span>K</h1>

    <a class="hero__cue" href="#rsvp">Let us know you're coming</a>

</header>

<main>
  <section class="wrap note">
    <p class="lead">We'd like a room full of people who love us. <br><em>That's you!!!</em></p>
     </section>

  <!-- ── EDIT ME: venue and timings ───────────────────────── -->
  <section class="wrap day">
    <h2>The day</h2>
    <p class="date">Saturday 7 November 2026</p>
    </section>
  <!-- ─────────────────────────────────────────────────────── -->

  <section class="rsvp" id="rsvp">
    <div class="wrap">
      <div class="rsvp__head">
        <h2>RSVP</h2>
        <p>Kindly reply by 30 September 2026.</p>
      </div>

      <form id="rsvpForm" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="First and last name" required>
        </div>

        <div class="field">
          <fieldset>
            <legend>Are you coming?</legend>
            <div class="choices">
              <label class="choice">
                <input type="radio" name="attending" value="Coming" required>
                <span>Absolutely, wouldn't miss it</span>
              </label>
              <label class="choice">
                <input type="radio" name="attending" value="Not coming">
                <span>Can't make it this time</span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="field">
          <label for="song">Nominate a song for our playlist</label>
          <input type="text" id="song" name="song" placeholder="Song and artist">
          <p class="hint">Optional, but the dancefloor is counting on you.</p>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this blank</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" id="submitBtn">RSVP now</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <div class="thanks" id="thanks" hidden>
        <h3>Thank you</h3>
        <p id="thanksMsg"></p>
      </div>
    </div>
  </section>
</main>

<footer>See you in November</footer>

<script>
  /* ═══════════════════════════════════════════════════════════
     PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE.
     It looks like: https://script.google.com/macros/s/AKfyc.../exec
     Until you do, the form runs in preview mode and saves nothing.
     ═══════════════════════════════════════════════════════════ */
  const RSVP_ENDPOINT = "https://script.google.com/macros/s/AKfycbzqDVCNDYcggY2Yb4JEwYUBg-qzKwSTJ78Bicyq6BLkTdzgIsYIzqRPCXP6UVsBMOR4/exec";

  const form = document.getElementById('rsvpForm');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');
  const thanks = document.getElementById('thanks');
  const thanksMsg = document.getElementById('thanksMsg');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.classList.remove('error');

    const nameInput = form.elements.name;
    const name = nameInput.value.trim();
    const attending = form.querySelector('input[name="attending"]:checked');

    if (!name) {
      statusEl.textContent = 'Please add your name so we know who to expect.';
      statusEl.classList.add('error');
      nameInput.focus();
      return;
    }
    if (!attending) {
      statusEl.textContent = 'Let us know whether you can make it.';
      statusEl.classList.add('error');
      return;
    }
    if (form.elements.website.value) return; // bot caught in the honeypot

    btn.disabled = true;
    btn.textContent = 'Sending…';

    const data = new FormData();
    data.append('name', name);
    data.append('attending', attending.value);
    data.append('song', form.elements.song.value.trim());
    data.append('page', location.href);

    try {
      if (RSVP_ENDPOINT) {
        await fetch(RSVP_ENDPOINT, { method: 'POST', mode: 'no-cors', body: data });
      } else {
        await new Promise(r => setTimeout(r, 600)); // preview mode
      }
      show(name, attending.value);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'RSVP now';
      statusEl.textContent = 'That didn\u2019t send. Try once more, or message us directly.';
      statusEl.classList.add('error');
    }
  });

  function show(name, attending) {
    const first = name.split(' ')[0];
    thanksMsg.textContent = attending === 'Coming'
      ? first + ', you\u2019re on the list. We\u2019ll send the details nearer the time.'
      : 'We\u2019ll miss you, ' + first + '. Thank you for letting us know.';
    form.hidden = true;
    thanks.hidden = false;
    thanks.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>
</body>
